# pawnlib.ini — configuration for the DDDA pawn db (real-Steam edition).
# Lives beside pawnlib.dll.  Lines starting with ; or # are comments.
#
# The archive root is hardcoded to <pawnlib.dll directory>/pawnlib/, with
# per-level subfolders pawnlib/<NNN>/.  Every inn rest drops <HEX>.pawn +
# <HEX>.meta into pawnlib/<NNN>/ where <NNN> is the pawn's level at archive
# time, zero-padded to three digits.  At save time, an <HEX>.xml sidecar
# is added.  No ini knob to relocate this — change it and the rest of the
# pawnlib install breaks.

# Cap on how many archives surface per rift search (per level).  Most-recent
# first.  Excess archives stay on disk but aren't shown.  Range: 0..100;
# 0 makes the rift look empty (useful for read-only browsing during testing).
max_search_results = 100

# pawnlib.log handling.  One of:
#   disabled - no log file written (silent operation)
#   truncate - log file is reset to empty at each session start (default)
#   append   - new session appends to the existing log
logging = truncate

# Archive the player's current main pawn on every inn rest.
#   1 - (default) write <HEX>.pawn + <HEX>.meta into pawnlib/<NNN>/, plus
#       (at save time) an <HEX>.xml sidecar carrying the live mCmc[0]
#       region for restore_pawn to splice into a future save's main slot.
#   0 - skip export; the archive tree is never written to.  Use to read-
#       only browse existing archives without adding new ones.
enable_exports = 1

# Write hired-pawn gear/knowledge back into the source archive on save.
# Lets changes made to a hired pawn (re-equipping, teaching) persist to
# the archive they were summoned from.
#   1 - (default) on FileWrite('DDDA.sav'), patch each hired pawn's
#       origin .pawn file in place via the Blowfish/zlib/SHA-1 pipeline.
#       Also drops an <HEX>.xml sidecar with the rental's full
#       cSAVE_DATA_CMC region (vocation, skills, augments, inclinations).
#   0 - skip writeback; hired pawns revert to their archived state next
#       summon.
enable_updates = 1
